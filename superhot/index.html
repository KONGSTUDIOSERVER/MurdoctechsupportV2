<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="hot.jpg" />
    <title>SUPERHOT</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ececec;
        font-family: "Arial Narrow", "Oswald", "Helvetica Neue", Arial, sans-serif;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #ececec;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(1200px 600px at 50% 40%, #fff 0%, #ececec 55%, #ddd 100%);
        color: #161616;
      }
      #loader.gone {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s ease;
      }
      .wordmark {
        font-size: clamp(42px, 9vw, 84px);
        font-weight: 700;
        letter-spacing: 0.18em;
        line-height: 1;
        text-indent: 0.18em;
      }
      .wordmark .hot {
        color: #e23b1e;
      }
      .bar {
        width: min(280px, 70vw);
        height: 3px;
        background: rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }
      #bar-fill {
        height: 100%;
        width: 0%;
        background: #e23b1e;
        transition: width 0.2s linear;
      }
      #status {
        font-size: 11px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #6a6a6a;
        min-height: 1.2em;
      }
      #loader.error .wordmark .hot {
        color: #8a1a10;
      }
      #loader.error #status {
        color: #8a1a10;
        letter-spacing: 0.16em;
        max-width: 80vw;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="wordmark"><span>SUPER</span><span class="hot">HOT</span></div>
      <div class="bar"><div id="bar-fill"></div></div>
      <div id="status">LOADING</div>
    </div>
    <canvas
      class="emscripten"
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
    ></canvas>
    <script>
      var loader = document.getElementById("loader");
      var fill = document.getElementById("bar-fill");
      var status = document.getElementById("status");

      function UnityProgress() {
        this.SetProgress = function (p) {
          var pct = Math.max(0, Math.min(1, Number(p) || 0));
          fill.style.width = Math.round(pct * 100) + "%";
        };
        this.SetMessage = function (message) {
          var text = String(message || "").replace(/\s+/g, " ").trim();
          status.textContent = text ? text.toUpperCase() : "LOADING";
        };
        this.Clear = function () {
          fill.style.width = "100%";
          status.textContent = "TIME MOVES WHEN YOU MOVE";
          loader.classList.add("gone");
          window.setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 500);
        };
      }

      var Module = {
        TOTAL_MEMORY: 268435456,
        errorhandler: function (err) {
          loader.classList.remove("gone");
          loader.classList.add("error");
          status.textContent = String(err || "FAILED TO START");
          return true;
        },
        compatibilitycheck: function () {},
        dataUrl: "webgl.datagz",
        codeUrl: "webgl.jsgz",
        memUrl: "webgl.memgz",
      };
    </script>
    <script src="UnityLoader.js"></script>
  </body>
</html>
