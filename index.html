<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="murdoc-ai-endpoint" content="https://murdoc-ai.omarroblox21.workers.dev/api/chat">
  <title>Murdoc Tech Support V2</title>
  <script src="coi-serviceworker.js"></script>
  <link rel="stylesheet" href="ai-chat.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <iframe id="arcade" src="arcade.html" title="Murdoc Tech Support V2 games and settings" allow="fullscreen" allowfullscreen></iframe>
  <button id="ai-open" class="btn ai-launcher" type="button" aria-haspopup="dialog" aria-controls="ai-view" aria-expanded="false">✦ MURDOC AI</button>
  <dialog id="ai-view" aria-labelledby="ai-title">
    <div class="ai-panel">
      <div class="ai-header">
        <h1 id="ai-title">✦ MURDOC AI</h1>
        <button id="ai-close" class="btn" type="button" aria-label="Close AI chat">✕</button>
      </div>
      <p class="ai-intro">Your sidekick for tech, coding, and games.</p>
      <div id="ai-messages" class="ai-messages" role="log" aria-label="Conversation with Murdoc AI" aria-live="polite" aria-relevant="additions text" tabindex="0"></div>
      <button id="ai-clear" class="btn" type="button">NEW CHAT</button>
      <form id="ai-form">
        <label for="ai-input">Your message</label>
        <div class="ai-compose">
          <textarea id="ai-input" rows="2" maxlength="2000" required placeholder="Ask Murdoc AI anything…" aria-describedby="ai-note"></textarea>
          <button id="ai-send" class="btn" type="submit">SEND ↗</button>
        </div>
        <p id="ai-status" role="status" aria-live="polite"></p>
        <p id="ai-note" class="ai-note">Messages are sent to Google Gemini. Chat clears on reload. AI can make mistakes.</p>
      </form>
    </div>
  </dialog>
  <script src="ai-chat.js"></script>
  <script src="pages.js"></script>
</body>
</html>
